[project]
name = "code-quest-back"
version = "0.1.0"
description = "CodeQuest backend: gamified Computational Thinking platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langgraph>=1.1.10",
    "numpy>=2.4.4",
    "passlib>=1.7.4",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.49",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# UP042: TCC1 str-Enums are kept as is (no behavior change in phase 00).
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Long prompt/data literals in TCC1 code; both files are replaced in later phases.
"seed.py" = ["E501"]
"app/ai/ai_service.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "req(id): requirement ID proven by this test",
    "live: calls a real external provider; skipped by default",
    "legacy: characterization test of TCC1 behavior",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api > services > repositories > models"
type = "layers"
layers = ["app.api", "app.services", "app.repositories", "app.models"]

[[tool.importlinter.contracts]]
name = "api must not import repositories, models, ai, sqlalchemy"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories", "app.models", "app.ai", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services must not import fastapi, starlette, sqlalchemy"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "sqlalchemy", "fastapi", "app.models", "app.repositories",
    "app.services", "app.ai", "app.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ai is isolated"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.api", "app.services", "app.repositories", "app.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core imports no upper layer"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.services", "app.repositories", "app.models"]
allow_indirect_imports = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
