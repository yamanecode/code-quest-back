[project]
name = "code-quest-back"
version = "0.1.0"
description = "CodeQuest API: gamified computational-thinking challenges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "bcrypt>=5.0",
    "pyjwt>=2.15",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"tools/**" = ["S314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib -m 'not functional and not live'"
markers = [
    "req(id): requirement ID proved by a functional test",
    "functional: black-box acceptance test against a running server",
    "live: calls a real LLM provider; never run by default",
]

[tool.coverage.run]
source = ["app"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure Python"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.services",
    "app.infra",
    "app.core",
    "app.cli",
    "app.main",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "httpx",
    "jwt",
    "bcrypt",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not know the upper layers"
type = "forbidden"
source_modules = ["app.infra"]
forbidden_modules = ["app.api", "app.services", "app.main", "app.cli", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Services use the LLM port, not HTTP or adapters"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.api",
    "app.main",
    "app.cli",
    "app.infra.llm",
    "fastapi",
    "starlette",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Presentation goes through services"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.infra", "app.domain", "sqlalchemy"]
ignore_imports = [
    "app.api.deps -> app.infra.**",
    "app.api.deps -> app.domain.**",
    "app.api.deps -> sqlalchemy",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["app.api", "app.services", "app.domain"]
